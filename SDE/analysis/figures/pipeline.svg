<svg xmlns="http://www.w3.org/2000/svg" aria-label="Pipeline: six sensors feed a safety microcontroller on the chest and a phone app; both drive two vibrating wristbands over Bluetooth Low Energy" width="1664" height="560" viewBox="0 0 1664 560" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1664" height="560" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16212b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9692a"/></marker></defs>
<g font-size="21">
<rect x="0" y="10" width="380" height="64" rx="8" fill="#ffffff" stroke="#2f5f94" stroke-width="2"/><text x="20" y="50">2 × ToF, 8×8 zones · 15 Hz</text>
<rect x="0" y="100" width="380" height="64" rx="8" fill="#ffffff" stroke="#2f5f94" stroke-width="2"/><text x="20" y="140">mmWave radar · 10 Hz</text>
<rect x="0" y="190" width="380" height="64" rx="8" fill="#ffffff" stroke="#2f5f94" stroke-width="2"/><text x="20" y="230">Sign camera · 1 Hz near doors</text>
<rect x="0" y="280" width="380" height="64" rx="8" fill="#ffffff" stroke="#2f5f94" stroke-width="2"/><text x="20" y="320">Foot IMU, ZUPT · 2 Hz steps</text>
<rect x="0" y="370" width="380" height="64" rx="8" fill="#ffffff" stroke="#2f5f94" stroke-width="2"/><text x="20" y="410">Barometer · 10 Hz</text>
<rect x="0" y="460" width="380" height="64" rx="8" fill="#ffffff" stroke="#2f5f94" stroke-width="2"/><text x="20" y="500">Phone GNSS · 1 Hz, outdoors</text>
<rect x="520" y="10" width="420" height="120" rx="10" fill="#fbe3d3" stroke="#d9692a" stroke-width="3"/><text x="540" y="55" font-weight="700">Safety MCU, chest unit</text><text x="540" y="95">obstacle or drop ≤ 3 m → STOP</text>
<rect x="520" y="190" width="420" height="334" rx="10" fill="#ffffff" stroke="#16212b" stroke-width="2"/><text x="540" y="235" font-weight="700">Phone app, in pocket</text><text x="540" y="280">pose filter (IMU, GNSS, walls)</text><text x="540" y="320">radar tracker, closing speed</text><text x="540" y="360">room-number reader</text><text x="540" y="400">route planner, no prior map</text><text x="540" y="440">cue generator</text><text x="540" y="490" fill="#4f5b66">heartbeat 10 Hz → safety MCU</text>
<rect x="1100" y="10" width="560" height="120" rx="10" fill="#fbe3d3" stroke="#d9692a" stroke-width="3"/><text x="1120" y="55" font-weight="700">Two wristbands, L and R</text><text x="1120" y="95">left, right, both = stop</text>
<rect x="1100" y="190" width="560" height="200" rx="10" fill="#ffffff" stroke="#16212b" stroke-width="2"/><text x="1120" y="235" font-weight="700">Each band watches its link</text><text x="1120" y="280">silent for 2 periods →</text><text x="1120" y="320">"guidance unavailable"</text><text x="1120" y="360" fill="#4f5b66">motor current check every 60 s</text>
<text x="1100" y="450" font-weight="700">BLE load: 0.12 Mbit/s</text><text x="1100" y="490" fill="#4f5b66">latency: 0.19 s near, 0.35 s far</text>
</g>
<g stroke="#16212b" stroke-width="3" fill="none">
<path d="M380,42 L516,60" stroke="#d9692a" marker-end="url(#b)"/>
<path d="M380,132 L516,260" marker-end="url(#a)"/><path d="M380,222 L516,300" marker-end="url(#a)"/><path d="M380,312 L516,340" marker-end="url(#a)"/><path d="M380,402 L516,380" marker-end="url(#a)"/><path d="M380,492 L516,420" marker-end="url(#a)"/>
<path d="M940,70 L1096,70" stroke="#d9692a" marker-end="url(#b)"/>
<path d="M940,300 L1096,120" marker-end="url(#a)"/>
<path d="M730,190 L730,134" stroke-dasharray="8 6" marker-end="url(#a)"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>